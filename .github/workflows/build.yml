name: Build, test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: MSIX version (four numbers, each 0-65535)
        default: "1.0.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PACKAGE_VERSION: ${{ inputs.version || '1.0.0.0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LightCraftMidi.slnx

      - name: Build
        run: dotnet build LightCraftMidi.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests\LightCraftMidi.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory artifacts\test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Package self-contained Windows x64 MSIX
        run: .\packaging\Build-Msix.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload unsigned installer and checksum
        uses: actions/upload-artifact@v7
        with:
          name: LightCraftMidi-${{ env.PACKAGE_VERSION }}-win-x64-unsigned
          path: |
            artifacts/msix/*.msix
            artifacts/msix/*.sha256
          if-no-files-found: error
          retention-days: 30
